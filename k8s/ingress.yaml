apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: leetcode-tracker
spec:
  ingressClassName: nginx
  rules:
    - host: leetcode.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
