<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LeetCode Tracker Sync</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; }
    input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 8px; cursor: pointer; }
    .error { color: #b91c1c; font-size: 13px; margin-top: 8px; }
    .success { color: #15803d; font-size: 13px; margin-top: 8px; }
    .muted { color: #6b7280; font-size: 12px; margin-top: 4px; }
    #recent-list { list-style: none; padding: 0; margin: 8px 0 0; max-height: 200px; overflow-y: auto; }
    #recent-list li { font-size: 12px; padding: 4px 0; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; gap: 8px; }
    #recent-list li:last-child { border-bottom: none; }
    .status-accepted { color: #15803d; }
    .status-other { color: #6b7280; }
  </style>
</head>
<body>
  <h1>LeetCode Tracker</h1>

  <div id="login-view" hidden>
    <form id="login-form">
      <label>
        Username
        <input type="text" id="username" required />
      </label>
      <label>
        Password
        <input type="password" id="password" required />
      </label>
      <button type="submit">Log in</button>
    </form>
    <p id="login-error" class="error" hidden></p>
    <p class="muted">No account? <a href="#" id="show-signup">Sign up</a></p>
  </div>

  <div id="signup-view" hidden>
    <form id="signup-form">
      <label>
        Username
        <input type="text" id="signup-username" required />
      </label>
      <label>
        Password
        <input type="password" id="signup-password" required minlength="6" />
      </label>
      <button type="submit">Sign up</button>
    </form>
    <p id="signup-error" class="error" hidden></p>
    <p class="muted">Already have an account? <a href="#" id="show-login">Log in</a></p>
  </div>

  <div id="sync-view" hidden>
    <button id="sync-button">Sync Now</button>
    <p id="last-sync" class="muted"></p>
    <p id="sync-message"></p>
    <ul id="recent-list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
