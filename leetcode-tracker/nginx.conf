server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing, so a direct navigation or
    # refresh on any path (e.g. /login) must still resolve to index.html
    # and let the app's own router take over, rather than nginx 404ing on
    # a path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
