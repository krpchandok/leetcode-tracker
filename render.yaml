services:
  - type: web
    name: leetcode-tracker-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_INPROCESS_CONSUMERS
        value: 'true'
      - key: CORS_ORIGIN
        value: https://leetcode-tracker.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TASK_TOKEN
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: KAFKA_BROKER
        sync: false
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
  - type: web
    name: leetcode-tracker
    runtime: static
    rootDir: leetcode-tracker
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://leetcode-tracker-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html